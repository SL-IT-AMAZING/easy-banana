<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyBanana - AI Coding Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .emoji { font-size: 4rem; margin-bottom: 1rem; }
    p { color: #aaa; margin-bottom: 2rem; font-size: 1.2rem; }
    code {
      background: rgba(255,255,255,0.1);
      padding: 1rem 2rem;
      border-radius: 8px;
      display: inline-block;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🍌</div>
    <h1>EasyBanana</h1>
    <p>AI-powered coding assistant for your terminal</p>
    <code>curl -fsSL https://easy-banana.com/install | bash</code>
  </div>
</body>
</html>
